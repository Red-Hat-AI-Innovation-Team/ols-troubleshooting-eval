apiVersion: v1
kind: Namespace
metadata:
  name: simulate-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: simulate-test
  labels:
    app: nginx-app
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
      - name: nginx
        image: busybox:1.36
        command: ["/bin/sh"]
        args:
        - -c
        - |
          if [ -z "${APP_CONFIG_PATH}" ]; then
            echo "Required environment variable APP_CONFIG_PATH is not set"
            exit 1
          fi
          while true; do echo "serving on $APP_CONFIG_PATH"; sleep 10; done
        resources:
          requests:
            cpu: "5m"
            memory: "32Mi"
