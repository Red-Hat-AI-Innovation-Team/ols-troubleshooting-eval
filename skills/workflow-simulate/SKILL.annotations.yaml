analyze_query:
  type: AgentNode
  id: analyze_query
  role: strategist
  blocking: 'true'
  reads: []
  writes:
  - .factory/simulate/analysis.json
  edges_out:
  - target: gate_analysis
    condition: null
  slots:
    task_prompt_analyze_query: "Analyze the user's troubleshooting query to identify\
      \ which Kubernetes resources to snapshot from the target cluster.\n\nRead the\
      \ simulate task config from .factory/simulate/task.json for the user's query\
      \ text, target kubeconfig path, microshift_port (default 6443), and any explicit\
      \ namespace or resource-type overrides.\n\nIf the user provided explicit --target-namespaces\
      \ or --resource-types, use those directly. Otherwise, analyze the query to extract:\n\
      - Relevant namespaces (max 10)\n- Resource types to snapshot (deployments, services,\
      \ configmaps, secrets,   statefulsets, daemonsets, networkpolicies, ingresses,\
      \ routes, etc.)\n- Dependency hints (e.g., 'networking issue' → include NetworkPolicies,\
      \   Services, Ingresses)\n\nIf the target kubeconfig is accessible, run `kubectl\
      \ --kubeconfig <path> get namespaces -o name` to list available namespaces and\
      \ cross-reference with the query.\n\nWrite the extraction result to .factory/simulate/analysis.json\
      \ with this schema:\n```json\n{\n  \"query\": \"<original user query>\",\n \
      \ \"namespaces\": [\"ns1\", \"ns2\"],\n  \"resource_types\": [\"deployments\"\
      , \"services\", \"configmaps\"],\n  \"cluster_type\": \"microshift|minikube\"\
      ,\n  \"microshift_port\": 6443,\n  \"max_replicas\": 1,\n  \"rationale\": \"\
      <why these namespaces/resources are relevant>\"\n}\n```\nWrite output to: .factory/simulate/analysis.json"
    timeout_analyze_query: '300'
gate_analysis:
  type: GateNode
  id: gate_analysis
  evaluator_type: user
  reads:
  - .factory/simulate/analysis.json
  edges_out:
  - target: snapshot_cluster
    condition: PROCEED
  - target: analyze_query
    condition: RELOOP
  slots:
    max_iterations_gate_analysis: '3'
snapshot_cluster:
  type: AgentNode
  id: snapshot_cluster
  role: builder
  blocking: 'true'
  reads:
  - .factory/simulate/analysis.json
  writes:
  - .factory/simulate/snapshot-report.md
  edges_out:
  - target: gate_snapshot
    condition: null
  slots:
    task_prompt_snapshot_cluster: "Export and sanitize Kubernetes manifests from the\
      \ target cluster.\n\nRead .factory/simulate/analysis.json for the namespaces,\
      \ resource types, and cluster configuration.\n\nFor each namespace and resource\
      \ type in the analysis:\n1. Run `kubectl --kubeconfig <target_kubeconfig> get\
      \ <resource_type>    -n <namespace> -o yaml` to export manifests\n2. Sanitize\
      \ each manifest:\n   - Strip metadata.uid, metadata.resourceVersion, metadata.creationTimestamp,\
      \      metadata.managedFields, metadata.ownerReferences, status section\n  \
      \ - Scale down replicas to max_replicas (from analysis.json, default: 1)\n \
      \  - Replace secret data values with 'REDACTED' placeholders\n   - Convert PersistentVolumeClaim\
      \ storageClassName to 'standard'\n   - Minimize resource requests/limits (cpu:\
      \ 100m, memory: 128Mi)\n3. Save each manifest to .factory/simulate/manifests/<namespace>/<kind>-<name>.yaml\n\
      \nApply manifests in dependency order. Save files as:\n- CRDs first, then namespaces,\
      \ then configmaps/secrets, then deployments/services\n\nWrite a snapshot report\
      \ to .factory/simulate/snapshot-report.md listing:\n- Number of resources exported\
      \ per namespace\n- Resources skipped and why\n- Sanitization actions taken\n\
      Read: .factory/simulate/analysis.json\nWrite output to: .factory/simulate/snapshot-report.md"
    timeout_snapshot_cluster: '600'
gate_snapshot:
  type: GateNode
  id: gate_snapshot
  evaluator_type: fn
  evaluator_command: 'if [ -d {project_path}/.factory/simulate/manifests ] && [ "$(find
    {project_path}/.factory/simulate/manifests -name ''*.yaml'' | head -1)" ]; then
    echo ''PROCEED: manifests found''; else echo ''FAIL: no manifests exported'';
    exit 1; fi'
  reads:
  - .factory/simulate/snapshot-report.md
  edges_out:
  - target: provision_cluster
    condition: PROCEED
provision_cluster:
  type: AgentNode
  id: provision_cluster
  role: builder
  blocking: 'true'
  reads:
  - .factory/simulate/analysis.json
  writes:
  - .factory/simulate/provision-report.md
  edges_out:
  - target: gate_provision
    condition: null
  slots:
    task_prompt_provision_cluster: "Provision an ephemeral Kubernetes cluster for\
      \ troubleshooting.\n\nRead .factory/simulate/analysis.json for cluster_type\
      \ (microshift or minikube) and microshift_port (integer, default 6443 if not\
      \ present).\n\nIf cluster_type is 'minikube':\n  1. Run `minikube start --profile\
      \ factory-simulate --memory 2048 --cpus 2`\n  2. Wait for cluster ready: `minikube\
      \ status --profile factory-simulate`\n  3. Export kubeconfig: `minikube kubeconfig\
      \ --profile factory-simulate`\n     Save to .factory/simulate/ephemeral-kubeconfig\n\
      \nIf cluster_type is 'microshift':\n  1. Read the microshift_port value from\
      \ analysis.json (default: 6443 if missing)\n  2. Start microshift container\
      \ — the host port is microshift_port, the container port is always 6443:\n \
      \    `podman run -d --name factory-simulate-microshift --privileged -v microshift-data:/var/lib\
      \ -p <microshift_port>:6443 quay.io/microshift/microshift-aio`\n     Example:\
      \ if microshift_port is 8443, use `-p 8443:6443`\n     Example: if microshift_port\
      \ is the default (6443), the mapping is the default port to 6443\n  3. Wait\
      \ for API server ready (poll with retries)\n  4. Copy kubeconfig from container\
      \ to .factory/simulate/ephemeral-kubeconfig\n  5. Patch the kubeconfig server\
      \ URL to use the configured host port:\n     `sed -i '' \"s|server: https://127.0.0.1:6443|server:\
      \ https://127.0.0.1:<microshift_port>|\" .factory/simulate/ephemeral-kubeconfig`\n\
      \     Skip this sed step if microshift_port is 6443 (no change needed).\n\n\
      Write a provision report to .factory/simulate/provision-report.md with:\n- Cluster\
      \ type used\n- Host port used for MicroShift API server\n- Kubeconfig path\n\
      - Cluster status (nodes, API server health)\n- Any warnings or issues\nRead:\
      \ .factory/simulate/analysis.json\nWrite output to: .factory/simulate/provision-report.md"
    timeout_provision_cluster: '600'
gate_provision:
  type: GateNode
  id: gate_provision
  evaluator_type: fn
  evaluator_command: 'if [ -f {project_path}/.factory/simulate/ephemeral-kubeconfig
    ] && kubectl --kubeconfig {project_path}/.factory/simulate/ephemeral-kubeconfig
    cluster-info 2>/dev/null; then echo ''PROCEED: cluster responding''; else echo
    ''FAIL: cluster not ready''; exit 1; fi'
  reads:
  - .factory/simulate/provision-report.md
  edges_out:
  - target: apply_manifests
    condition: PROCEED
apply_manifests:
  type: AgentNode
  id: apply_manifests
  role: builder
  blocking: 'true'
  reads:
  - .factory/simulate/provision-report.md
  writes:
  - .factory/simulate/apply-report.md
  edges_out:
  - target: verify_cluster
    condition: null
  slots:
    task_prompt_apply_manifests: 'Apply sanitized manifests to the ephemeral cluster.


      Read the ephemeral kubeconfig from .factory/simulate/ephemeral-kubeconfig.

      Read manifests from .factory/simulate/manifests/.


      Apply in dependency order:

      1. CRDs (if any)

      2. Namespaces

      3. ConfigMaps and Secrets

      4. Services, ServiceAccounts, Roles, RoleBindings

      5. Deployments, StatefulSets, DaemonSets

      6. Ingresses, Routes, NetworkPolicies


      For each manifest:

      - Run `kubectl --kubeconfig <ephemeral> apply -f <manifest>`

      - On error: log the error and continue (do NOT abort)

      - Track applied vs skipped resources


      Write an apply report to .factory/simulate/apply-report.md with:

      - Resources applied successfully (count per kind)

      - Resources that failed and error messages

      - Resources skipped and reasons

      Read: .factory/simulate/provision-report.md

      Write output to: .factory/simulate/apply-report.md'
    timeout_apply_manifests: '600'
verify_cluster:
  type: AgentNode
  id: verify_cluster
  role: health_checker
  blocking: 'true'
  reads:
  - .factory/simulate/apply-report.md
  writes:
  - .factory/simulate/verify-report.md
  edges_out:
  - target: gate_verify
    condition: null
  slots:
    task_prompt_verify_cluster: 'Verify the structural topology of the ephemeral cluster.


      Read the ephemeral kubeconfig from .factory/simulate/ephemeral-kubeconfig.

      Read .factory/simulate/apply-report.md for what was applied.


      Run these verification checks:

      1. Namespace existence: `kubectl get namespaces` — verify expected namespaces
      exist

      2. Resource counts: For each namespace, compare expected vs actual resource
      counts

      3. Service topology: Verify services have matching endpoints/selectors

      4. Deployment status: Check deployments exist (pods may be Pending — that is
      OK)

      5. ConfigMap/Secret presence: Verify referenced configs exist


      Calculate a structural health score (0.0–1.0):

      - 1.0 = all expected resources exist with correct topology

      - 0.5 = at least half of expected resources applied

      - 0.0 = nothing applied or cluster unreachable


      Write a verification report to .factory/simulate/verify-report.md with:

      - Structural health score

      - Per-namespace resource comparison table

      - Topology issues found

      - Connectivity info: `export KUBECONFIG=.factory/simulate/ephemeral-kubeconfig`

      Read: .factory/simulate/apply-report.md

      Write output to: .factory/simulate/verify-report.md'
    timeout_verify_cluster: '600'
gate_verify:
  type: GateNode
  id: gate_verify
  evaluator_type: fn
  evaluator_command: 'if grep -qE ''score.*[0-9]'' {project_path}/.factory/simulate/verify-report.md;
    then echo ''PROCEED: verification report generated''; else echo ''FAIL: no verification
    score found''; exit 1; fi'
  reads:
  - .factory/simulate/verify-report.md
  edges_out:
  - target: archivist
    condition: PROCEED
archivist:
  type: AgentNode
  id: archivist
  role: archivist
  blocking: 'false'
  reads:
  - .factory/simulate/verify-report.md
  writes:
  - .factory/archive/simulate-session.md
  edges_out: []
  slots:
    task_prompt_archivist: 'Archive this simulate session.


      Read the following artifacts:

      - .factory/simulate/analysis.json (query analysis)

      - .factory/simulate/snapshot-report.md (what was exported)

      - .factory/simulate/provision-report.md (cluster provisioning)

      - .factory/simulate/apply-report.md (manifest application)

      - .factory/simulate/verify-report.md (structural verification)


      Write a concise session summary to .factory/archive/simulate-session.md covering:

      - Original query and extracted scope

      - Cluster type used

      - Resources applied vs skipped

      - Structural health score

      - Lessons learned or issues encountered

      Read: .factory/simulate/verify-report.md

      Write output to: .factory/archive/simulate-session.md'
    timeout_archivist: '300'
