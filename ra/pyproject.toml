[project]
name = "ra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary",
    "anthropic[vertex]",
    "openai",
    "pyyaml",
    "scikit-learn>=1.9.0",
    "plotly>=6.8.0",
    "tenacity>=9.1.4",
    "transformers>=5.12.1",
    "jinja2>=3.1.6",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
